<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>অ্যাডমিন প্যানেল — আল-বাছির জামে মসজিদ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
:root { --emerald:#103D2B; --forest:#176B4A; --gold:#C6A36B; --gold-text:#8A6A2E; --ivory:#F7F5EF; --charcoal:#242B27; --muted:#5B645E; --border:#E4DFD3; --danger:#9A3B2E; --ok:#1F8059; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Hind Siliguri','Lato',system-ui,sans-serif; background: var(--ivory); color: var(--charcoal); line-height: 1.55; font-size: 16px; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

/* Login */
.login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.25rem; background: var(--emerald); }
.login-card { width: min(100%, 400px); padding: 2rem 1.6rem; border-radius: 18px; background: #fff; box-shadow: 0 30px 80px rgba(0,0,0,.35); }
.login-card h1 { font-size: 1.4rem; color: var(--emerald); margin-bottom: .2rem; }
.login-card p.sub { color: var(--muted); font-size: .92rem; margin-bottom: 1.4rem; }
label.f { display: block; font-weight: 600; font-size: .9rem; margin: .8rem 0 .3rem; }
input[type=text], input[type=email], input[type=password], input[type=url], input[type=number], input[type=date], input[type=time], select, textarea {
  width: 100%; padding: .65rem .8rem; border: 1.5px solid #D6D0C2; border-radius: 10px; background: #fff; min-height: 44px; }
textarea { min-height: 84px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--forest); box-shadow: 0 0 0 3px rgba(23,107,74,.16); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: .55rem 1.2rem; border: 0; border-radius: 10px; font-weight: 700; background: var(--forest); color: #fff; }
.btn:hover { background: var(--emerald); }
.btn:disabled { opacity: .6; cursor: progress; }
.btn.ghost { background: transparent; color: var(--forest); border: 1.5px solid var(--forest); }
.btn.ghost:hover { background: var(--forest); color: #fff; }
.btn.danger { background: var(--danger); }
.btn.small { min-height: 34px; padding: .25rem .8rem; font-size: .88rem; }
.msg { margin-top: .9rem; font-size: .92rem; min-height: 1.3em; }
.msg.err { color: var(--danger); font-weight: 600; }
.notice { padding: .8rem 1rem; border-radius: 10px; background: #FFF6E2; border: 1px solid #E8D5A5; color: #6b5420; font-size: .92rem; margin-bottom: 1rem; }

/* App shell */
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: .8rem; padding: .6rem 1rem; background: var(--emerald); color: #fff; }
.topbar h1 { font-size: .98rem; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .who { font-size: .8rem; opacity: .75; display: none; }
.topbar a, .topbar button { color: #fff; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.3); border-radius: 8px; padding: .3rem .8rem; font-size: .85rem; text-decoration: none; min-height: 34px; }
.layout { display: block; }
.tabs { display: flex; gap: .4rem; overflow-x: auto; padding: .6rem .8rem; background: #fff; border-bottom: 1px solid var(--border); position: sticky; top: 46px; z-index: 15; }
.tab { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: .45rem .9rem; border: 1.5px solid var(--border); border-radius: 999px; background: #fff; font-weight: 600; font-size: .92rem; color: var(--muted); white-space: nowrap; }
.tab.active { background: var(--forest); border-color: var(--forest); color: #fff; }
.badge { min-width: 20px; padding: 0 6px; border-radius: 999px; background: var(--danger); color: #fff; font-size: .75rem; line-height: 20px; text-align: center; }
main { max-width: 900px; margin: 0 auto; padding: 1rem 1rem 7rem; }
h2.title { font-size: 1.35rem; color: var(--emerald); margin-bottom: .3rem; }
p.help { color: var(--muted); font-size: .92rem; margin-bottom: 1rem; }
.card { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 1rem; margin-bottom: 1rem; }
.card h3 { font-size: 1.05rem; color: var(--emerald); margin-bottom: .5rem; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem; }
@media (max-width: 560px) { .row2 { grid-template-columns: 1fr; gap: 0; } }
.field { margin-bottom: .6rem; }
.field > .lab { display: block; font-weight: 600; font-size: .88rem; margin-bottom: .25rem; }
.field .hint { font-size: .8rem; color: var(--muted); margin-top: .2rem; }
.sub-lab { display: block; font-size: .75rem; color: var(--gold-text); font-weight: 700; margin-bottom: .15rem; letter-spacing: .04em; }
.check { display: flex; align-items: center; gap: .6rem; font-weight: 600; min-height: 44px; }
.check input { width: 22px; height: 22px; accent-color: var(--forest); }
.item { border: 1.5px solid var(--border); border-radius: 12px; background: #fff; margin-bottom: .6rem; }
.item[open] { border-color: var(--gold); }
.item > summary { display: flex; align-items: center; gap: .5rem; padding: .6rem .8rem; cursor: pointer; list-style: none; font-weight: 600; }
.item > summary::-webkit-details-marker { display: none; }
.item > summary .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item > summary .ctl { display: flex; gap: .25rem; }
.ctl button { width: 34px; height: 34px; border: 1px solid var(--border); border-radius: 8px; background: #fff; font-size: 1rem; line-height: 1; }
.ctl button:hover { background: var(--ivory); }
.ctl button.del { color: var(--danger); }
.item .body { padding: .2rem .9rem .8rem; border-top: 1px solid var(--border); }
.chip { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: .72rem; font-weight: 700; background: #E6F2EC; color: var(--ok); margin-left: .4rem; }
.chip.past { background: #EEE; color: #777; } .chip.sched { background: #FFF1CC; color: #8a6200; }
.preview { display: block; width: 72px; height: 72px; margin-top: .4rem; border-radius: 10px; object-fit: cover; border: 1px solid var(--border); background: #eee; }
.savebar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; align-items: center; gap: .8rem; padding: .7rem 1rem; background: #fff; border-top: 1px solid var(--border); box-shadow: 0 -6px 20px rgba(0,0,0,.08); }
.savebar .st { flex: 1; font-size: .9rem; color: var(--muted); }
.savebar .st.dirty { color: var(--gold-text); font-weight: 700; }
.toast { position: fixed; left: 50%; bottom: 5rem; transform: translateX(-50%); z-index: 50; max-width: 90vw; padding: .7rem 1.2rem; border-radius: 12px; background: var(--emerald); color: #fff; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
.toast.err { background: var(--danger); }
table.pt { width: 100%; border-collapse: collapse; }
table.pt th, table.pt td { padding: .45rem .3rem; text-align: left; vertical-align: middle; font-size: .92rem; }
table.pt th { font-size: .78rem; color: var(--gold-text); }
table.pt tr + tr td { border-top: 1px solid var(--border); }
.rv { border: 1px solid var(--border); border-left: 5px solid var(--border); border-radius: 12px; background: #fff; padding: .8rem 1rem; margin-bottom: .6rem; }
.rv.unread { border-left-color: var(--gold); background: #FFFCF3; }
.rv .top { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
.stars { color: var(--gold); font-size: 1.15rem; letter-spacing: 2px; }
.rv .meta { font-size: .8rem; color: var(--muted); }
.rv p { margin: .4rem 0 .6rem; white-space: pre-wrap; overflow-wrap: anywhere; }
.rv .acts { display: flex; gap: .5rem; }
.summary { display: flex; gap: 1.2rem; flex-wrap: wrap; align-items: baseline; margin-bottom: .8rem; }
.summary .big { font-size: 2rem; font-weight: 700; color: var(--emerald); }
@media (min-width: 900px) { .topbar .who { display: block; } }
</style>
</head>

<div id="login" class="login-wrap">
  <form class="login-card" id="loginForm" autocomplete="on">
    <h1>🕌 অ্যাডমিন প্যানেল</h1>
    <p class="sub">আল-বাছির জামে মসজিদ — শুধু অ্যাডমিনের জন্য</p>
    <div class="notice" id="cfgWarn" hidden>এখনো <b>firebase-config.js</b> ফাইলে Firebase-এর তথ্য (apiKey, projectId) বসানো হয়নি। <b>SETUP-BN.md</b> গাইডের ধাপগুলো শেষ করুন।</div>
    <label class="f" for="email">ইমেইল</label>
    <input type="email" id="email" autocomplete="username" required>
    <label class="f" for="password">পাসওয়ার্ড</label>
    <input type="password" id="password" autocomplete="current-password" required>
    <button class="btn" id="loginBtn" type="submit" style="width:100%;margin-top:1.1rem">লগইন করুন</button>
    <p class="msg" id="loginMsg" role="alert"></p>
  </form>
</div>

<div id="app" hidden>
  <header class="topbar">
    <h1>🕌 অ্যাডমিন প্যানেল</h1>
    <span class="who" id="who"></span>
    <a id="viewSite" href="index.html" target="_blank" rel="noopener">ওয়েবসাইট ↗</a>
    <button id="logout" type="button">লগআউট</button>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="বিভাগ"></nav>
  <main id="main"></main>
  <div class="savebar" id="savebar">
    <span class="st" id="saveState">সব পরিবর্তন সংরক্ষিত</span>
    <button class="btn" id="saveBtn" type="button">💾 সংরক্ষণ করুন</button>
  </div>
</div>
<div class="toast" id="toast" hidden role="status"></div>

function restoreBackup(file) {

      const out = clone(DEFAULTS); Object.keys(c).forEach(k => { out[k] = c[k]; }); content = out; markDirty(); tab = 'home'; renderTabs(); renderTab();
      toast('ব্যাকআপ লোড হয়েছে — "সংরক্ষণ করুন" চাপলে ওয়েবসাইটে কার্যকর হবে।');

const fmtDate = s => { try { return new Date(s).toLocaleString('bn-BD', { dateStyle: 'medium', timeStyle: 'short' }); } catch (e) { return s; } };

async function refreshReviews() { try { reviews = await fetchReviews(); renderTabs(); renderTab(); } catch (e) { toast('রিভিউ আনা যায়নি: ' + e.message, true); } }

async function delReview(r) { if (!confirm('এই রিভিউটি মুছে ফেলবেন?')) return; try { await api('reviews/' + encodeURIComponent(r.id), { method: 'DELETE' }); reviews = reviews.filter(x => x !== r); renderTabs(); renderTab(); } catch (e) { toast('মোছা যায়নি: ' + e.message, true); } }

async function openApp() {
